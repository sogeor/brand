<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#000000"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <text x="96" y="128" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" font-weight="600" fill="#ffffff" letter-spacing="6">SOGEOR</text>

  <text x="96" y="330" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="{{TITLE_SIZE}}" font-weight="700" fill="#ffffff" letter-spacing="-2">{{REPO}}</text>

  <text font-family="Inter, DejaVu Sans, sans-serif" font-size="34" fill="#a3a3a3">
    <tspan x="96" y="400">{{DESC1}}</tspan>
    <tspan x="96" y="446">{{DESC2}}</tspan>
  </text>

  <rect x="96" y="528" width="96" height="4" fill="#ffffff"/>
  <text x="96" y="580" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#737373">github.com/sogeor/{{REPO}}</text>
  <text x="1184" y="580" text-anchor="end" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" fill="#737373">sogeor.com</text>
</svg>
